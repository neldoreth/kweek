<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#36CFC9"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A65"/>
      <stop offset="1" stop-color="#FF5C38"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2933" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App icon background (squircle) -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)"/>

  <!-- Calendar binder rings -->
  <circle cx="88" cy="44" r="10" fill="url(#ringGrad)"/>
  <circle cx="168" cy="44" r="10" fill="url(#ringGrad)"/>

  <!-- Calendar card -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="44" width="160" height="172" rx="18" fill="#FFFFFF"/>
    <rect x="48" y="44" width="160" height="54" rx="18" fill="#FF7A59"/>
    <rect x="48" y="80" width="160" height="18" fill="#FF7A59"/>
  </g>

  <!-- Week dots row (Kweek) -->
  <circle cx="80"  cy="134" r="6" fill="#D0D5DD"/>
  <circle cx="103" cy="134" r="6" fill="#D0D5DD"/>
  <circle cx="126" cy="134" r="9" fill="#7B61FF"/>
  <circle cx="152" cy="134" r="6" fill="#D0D5DD"/>
  <circle cx="175" cy="134" r="6" fill="#D0D5DD"/>

  <!-- Day number -->
  <text x="128" y="196" text-anchor="middle"
        font-family="sans-serif" font-weight="700" font-size="68"
        fill="#1F2933">12</text>
</svg>
